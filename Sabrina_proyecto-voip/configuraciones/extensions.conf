[general]
static=yes
writeprotect=no

; SALAS DE CONFERENCIAS
[internos]
exten => _7XX,1,NoOp(Ingresando a la Sala de Conferencia ${EXTEN})
 same => n,Answer()
 same => n,ConfBridge(${EXTEN})
 same => n,Hangup()

; BUZON DE VOZ
exten => *97,1,NoOp(Acceso al buzon de voz)
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; LLAMADAS LOCALES CON DESVÍO A EXTENSIÓN SECUNDARIA
exten => _2XX,1,NoOp(Llamada local Sede 2 a la extension ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},15,tT) ; 15 SEGUNDOS DE ESPERA
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?desvio)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?desvio:fin)

 ; DESVIO DE LLAMADA A LA 202
 same => n(desvio),NoOp(La extension ${EXTEN} no respondio (${DIALSTATUS}). Desviando a la extension secundaria 202)
 same => n,Dial(PJSIP/202,15,tT) ; 15 SEGUNDOS DE ESPERA A LA LLAMADA SECUNDARIA
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?ocupado:nocontesta)

 ; EXTENSION SECUNDARIA NO RESPONDE: BUZON DE VOZ
 same => n(ocupado),VoiceMail(${EXTEN}@default,b)
 same => n,Hangup()
 same => n(nocontesta),VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()
 same => n(fin),Hangup()


; ENRUTAMIENTO SALIENTE A SEDES REMOTAS
; SEDE 1
exten => _1XX,1,NoOp(Llamada saliente a Sede 1)
 same => n,Dial(PJSIP/${EXTEN}@troncal-sede1,30,tT)
 same => n,Hangup()

; SEDE 3
exten => _3XX,1,NoOp(Llamada saliente a Sede 3)
 same => n,Dial(PJSIP/${EXTEN}@troncal-sede3,30,tT)
 same => n,Hangup()

; SEDE 4
exten => _4XX,1,NoOp(Llamada saliente a Sede 4)
 same => n,Dial(PJSIP/${EXTEN}@troncal-sede4,30,tT)
 same => n,Hangup()

; SEDE 5
exten => _5XX,1,NoOp(Llamada saliente a Sede 5)
 same => n,Dial(PJSIP/${EXTEN}@troncal-sede5,30,tT)
 same => n,Hangup()

;  LLAMADAS ENTRANTES DESDE TRONCALES
[desde-troncal]
exten => _2XX,1,NoOp(Llamada entrante hacia extension local Sede 2: ${EXTEN})
 same => n,Set(DESTINO_ORIGINAL=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},15,tT) ; 15 SEGUNDOS DE ESPERA
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?desvio)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?desvio:fin)

; DESVIO DE LLAMADA A LA 202
 same => n(desvio),NoOp(La extension ${DESTINO_ORIGINAL} no respondio. Desviando a la secundaria 202)
 same => n,Dial(PJSIP/202,15,tT)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?ocupado:nocontesta)

; EXTENSION SECUNDARIA NO RESPONDE: BUZON DE VOZ DE LA EXTENSION ORIGINAL
 same => n(ocupado),VoiceMail(${DESTINO_ORIGINAL}@default,b)
 same => n,Hangup()
 same => n(nocontesta),VoiceMail(${DESTINO_ORIGINAL}@default,u)
 same => n,Hangup()
 same => n(fin),Hangup()
