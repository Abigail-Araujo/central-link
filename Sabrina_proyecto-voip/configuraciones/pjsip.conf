; TRANSPORTE UDP
[transporte-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060   

; EXTENSIONES LOCALES (Sede 2 - 2XX)
[201]
type=endpoint
context=internos            
disallow=all                  
allow=ulaw,alaw              
auth=autenticacion-201      
aors=201                      
mailboxes=201@default 
rtp_timeout = 0
rtp_timeout_hold = 900 ; 15 min
direct_media = no
timers = yes    
timers_sess_expires = 180
timers_min_se = 90 

[autenticacion-201]
type=auth
auth_type=userpass
username=201
password=ClaveSegura201     

[201]
type=aor
max_contacts=1
remove_existing=yes                


