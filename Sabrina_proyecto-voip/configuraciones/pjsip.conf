; TRONCALES INTER-SEDE
; SEDE 1
[troncal-sede1]
type=endpoint
transport=transporte-udp
context=desde-troncal
disallow=all
allow=ulaw,alaw
aors=troncal-sede1
direct_media=no

[troncal-sede1]
type=aor
contact=sip:10.0.0.102:5060 ; IP y puerto de la PBX en Sede 1

[troncal-sede1]
type=identify
endpoint=troncal-sede1
match=10.0.0.102


