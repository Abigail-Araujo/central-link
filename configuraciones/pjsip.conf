; TRONCALES INTER-SEDE
; SEDE 2
[troncal-sede2]
type=endpoint
transport=transporte-udp
context=desde-troncal
disallow=all
allow=ulaw,alaw
aors=troncal-sede2
direct_media=no

[troncal-sede2]
type=aor
contact=sip:10.0.0.247:5060 ; IP y puerto de la PBX en Sede 2

[troncal-sede2]
type=identify
endpoint=troncal-sede2
match=10.0.0.247


