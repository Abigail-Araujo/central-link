; TRANSPORTE UDP
[transporte-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060   

; EXTENSIONES LOCALES (Sede 1 - 1XX)
[101]
type=endpoint
context=internos            
disallow=all                  
allow=ulaw,alaw              
auth=autenticacion-101      
aors=101                      
mailboxes=101@default 
rtp_timeout = 0
rtp_timeout_hold = 900 ; 15 min
direct_media = no
timers = yes    
timers_sess_expires = 180
timers_min_se = 90 

[autenticacion-101]
type=auth
auth_type=userpass
username=101
password=ClaveSegura101     

[101]
type=aor
max_contacts=1
remove_existing=yes                


